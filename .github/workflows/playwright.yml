name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-playwright-fallback-secret-do-not-use-in-prod' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || secrets.AUTH_SECRET || 'ci-playwright-fallback-secret-do-not-use-in-prod' }}
      AUTH_TRUST_HOST: "true"
      SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD || 'ci-sandbox-password' }}
      DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET || 'ci-test-bucket' }}
      DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT || 'nyc3.digitaloceanspaces.com' }}
      DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION || 'us-east-1' }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY || 'ci-test-key' }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET || 'ci-test-secret' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run Playwright Smoke Suite
      run: npm run test:e2e:smoke -- --reporter=list
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
