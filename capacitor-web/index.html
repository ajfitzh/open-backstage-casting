<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Open Backstage</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        text-align: center;
      }
      .card {
        max-width: 340px;
        background: #18181b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 28px 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 13px;
        color: #a1a1aa;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Open Backstage</h1>
      <p>Connecting to your production workspace. Please check your internet connection and try again.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
